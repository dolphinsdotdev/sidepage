[project]
name = "sidepage"
version = "0.1.0"
description = "Sidepage CLI — local-first hosting, tunneling, and directory for small apps and MCP servers"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "rich>=13.7",
    "starlette>=1.3.1",
    "typer>=0.12",
    "uvicorn>=0.52.1",
    "websockets>=17.0.1",
]

[project.scripts]
sidepage = "sidepage.cli:app"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
